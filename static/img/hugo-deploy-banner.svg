<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Noise texture filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="blend" mode="overlay"/>
    </filter>
    
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090909"/>
      <stop offset="50%" style="stop-color:#0e0e0e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Hugo logo-inspired symbol (H shape) -->
    <symbol id="hugo" viewBox="0 0 80 90">
      <!-- Stylized H -->
      <rect x="10" y="10" width="16" height="70" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <rect x="54" y="10" width="16" height="70" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <rect x="26" y="35" width="28" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Speed lines -->
      <line x1="75" y1="25" x2="85" y2="25" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <line x1="78" y1="45" x2="90" y2="45" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <line x1="75" y1="65" x2="85" y2="65" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    </symbol>
    
    <!-- Markdown file symbol -->
    <symbol id="markdown" viewBox="0 0 60 70">
      <!-- File shape -->
      <path d="M5 5 L40 5 L55 20 L55 65 L5 65 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M40 5 L40 20 L55 20" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <!-- MD text hint -->
      <text x="18" y="48" fill="#ffffff" font-family="'SF Mono', monospace" font-size="14" font-weight="bold" opacity="0.8">MD</text>
    </symbol>
    
    <!-- Git branch symbol -->
    <symbol id="gitBranch" viewBox="0 0 60 80">
      <!-- Main branch line -->
      <line x1="20" y1="10" x2="20" y2="70" stroke="#ffffff" stroke-width="2.5"/>
      <!-- Branch line -->
      <path d="M20 30 Q35 30 40 45 L40 55" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Commit dots -->
      <circle cx="20" cy="15" r="5" fill="#ffffff"/>
      <circle cx="20" cy="35" r="5" fill="#ffffff"/>
      <circle cx="20" cy="55" r="5" fill="#ffffff"/>
      <circle cx="40" cy="55" r="4" fill="#ffffff" opacity="0.7"/>
      <!-- Merge back -->
      <path d="M40 55 Q40 65 30 70" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
    </symbol>
    
    <!-- Deploy/rocket symbol -->
    <symbol id="deploy" viewBox="0 0 50 70">
      <!-- Rocket body -->
      <path d="M25 5 C15 15 12 35 15 50 L25 45 L35 50 C38 35 35 15 25 5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Window -->
      <circle cx="25" cy="25" r="6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="25" cy="25" r="2" fill="#ffffff"/>
      <!-- Fins -->
      <path d="M15 50 L8 60 L15 55" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M35 50 L42 60 L35 55" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Flame -->
      <path d="M20 50 Q25 65 30 50" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    </symbol>
    
    <!-- Cloud/CDN symbol -->
    <symbol id="cloud" viewBox="0 0 80 50">
      <path d="M65 40 C75 40 80 32 75 24 C78 16 70 8 60 12 C55 4 40 4 35 12 C25 8 15 16 20 28 C10 30 10 40 20 42 L65 42 C70 42 72 40 65 40" 
            fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Upload arrow -->
      <path d="M40 45 L40 28 M32 35 L40 28 L48 35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    
    <!-- Globe/web symbol -->
    <symbol id="globe" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="25" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Latitude lines -->
      <ellipse cx="30" cy="30" rx="25" ry="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <ellipse cx="30" cy="30" rx="25" ry="18" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
      <!-- Longitude lines -->
      <ellipse cx="30" cy="30" rx="10" ry="25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <line x1="30" y1="5" x2="30" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    </symbol>
    
    <!-- Terminal/build symbol -->
    <symbol id="terminal" viewBox="0 0 70 50">
      <rect x="3" y="3" width="64" height="44" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Title bar -->
      <line x1="3" y1="12" x2="67" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <circle cx="12" cy="7.5" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="20" cy="7.5" r="2" fill="#ffffff" opacity="0.5"/>
      <circle cx="28" cy="7.5" r="2" fill="#ffffff" opacity="0.5"/>
      <!-- Command prompt -->
      <text x="10" y="28" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" opacity="0.8">$ hugo</text>
      <text x="10" y="40" fill="#ffffff" font-family="'SF Mono', monospace" font-size="8" opacity="0.5">building...</text>
    </symbol>
    
    <!-- Netlify-inspired symbol -->
    <symbol id="netlify" viewBox="0 0 50 50">
      <!-- Diamond/gem shape -->
      <polygon points="25,2 48,25 25,48 2,25" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Inner structure -->
      <line x1="25" y1="2" x2="25" y2="48" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      <line x1="2" y1="25" x2="48" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      <!-- Center dot -->
      <circle cx="25" cy="25" r="4" fill="#ffffff"/>
    </symbol>
    
    <!-- GitHub Pages symbol -->
    <symbol id="ghPages" viewBox="0 0 50 50">
      <!-- Octocat-inspired simplified -->
      <circle cx="25" cy="25" r="20" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Branch icon inside -->
      <line x1="25" y1="12" x2="25" y2="38" stroke="#ffffff" stroke-width="2"/>
      <path d="M25 20 Q32 20 35 28" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="25" cy="15" r="3" fill="#ffffff"/>
      <circle cx="25" cy="30" r="3" fill="#ffffff"/>
      <circle cx="35" cy="28" r="2.5" fill="#ffffff" opacity="0.7"/>
    </symbol>
    
    <!-- Code brackets -->
    <symbol id="brackets" viewBox="0 0 50 60">
      <path d="M20 5 L8 5 Q3 5 3 10 L3 50 Q3 55 8 55 L20 55" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 5 L42 5 Q47 5 47 10 L47 50 Q47 55 42 55 L30 55" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Code lines inside -->
      <line x1="15" y1="20" x2="35" y2="20" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <line x1="15" y1="30" x2="30" y2="30" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <line x1="15" y1="40" x2="32" y2="40" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    </symbol>
    
    <!-- Dot grid pattern -->
    <pattern id="dotGrid" patternUnits="userSpaceOnUse" width="40" height="40">
      <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.15"/>
    </pattern>
    
    <!-- Flow line pattern -->
    <pattern id="flowLines" patternUnits="userSpaceOnUse" width="100" height="20">
      <line x1="0" y1="10" x2="100" y2="10" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Dot grid overlay -->
  <rect width="100%" height="100%" fill="url(#dotGrid)"/>
  
  <!-- Flow lines -->
  <rect width="100%" height="100%" fill="url(#flowLines)"/>
  
  <!-- Main pipeline flow visualization -->
  
  <!-- Stage 1: Content/Markdown (left) -->
  <g transform="translate(120, 220)" filter="url(#glow)">
    <!-- Content container -->
    <rect x="-20" y="-30" width="120" height="160" rx="8" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Markdown files stack -->
    <g transform="translate(0, 0)">
      <use href="#markdown" width="50" height="58"/>
    </g>
    <g transform="translate(15, 20)" opacity="0.6">
      <use href="#markdown" width="45" height="52"/>
    </g>
    <g transform="translate(30, 40)" opacity="0.4">
      <use href="#markdown" width="40" height="46"/>
    </g>
    
    <!-- Code brackets decoration -->
    <g transform="translate(25, 85)" opacity="0.5">
      <use href="#brackets" width="35" height="42"/>
    </g>
    
    <text x="40" y="145" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.5">content/</text>
  </g>
  
  <!-- Arrow 1: Content to Hugo -->
  <g filter="url(#softGlow)">
    <path d="M280 300 Q350 280 420 300" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <polygon points="420,300 410,295 410,305" fill="#ffffff" opacity="0.6"/>
    <!-- Animated dot -->
    <circle r="4" fill="#ffffff">
      <animateMotion dur="2s" repeatCount="indefinite" path="M280,300 Q350,280 420,300"/>
    </circle>
  </g>
  
  <!-- Stage 2: Hugo Build (center-left) -->
  <g transform="translate(450, 200)" filter="url(#strongGlow)">
    <!-- Hugo container with glow ring -->
    <circle cx="60" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
    <circle cx="60" cy="100" r="75" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" stroke-dasharray="6 4">
      <animateTransform attributeName="transform" type="rotate" from="0 60 100" to="360 60 100" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Hugo logo -->
    <g transform="translate(20, 55)">
      <use href="#hugo" width="80" height="90"/>
    </g>
    
    <!-- Terminal below -->
    <g transform="translate(25, 150)" opacity="0.7">
      <use href="#terminal" width="70" height="50"/>
    </g>
    
    <text x="60" y="220" fill="#ffffff" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle" opacity="0.6">hugo build</text>
  </g>
  
  <!-- Arrow 2: Hugo to Git -->
  <g filter="url(#softGlow)">
    <path d="M620 300 Q700 320 780 300" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <polygon points="780,300 770,295 770,305" fill="#ffffff" opacity="0.6"/>
    <circle r="4" fill="#ffffff">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M620,300 Q700,320 780,300"/>
    </circle>
  </g>
  
  <!-- Stage 3: Git/Version Control (center) -->
  <g transform="translate(800, 210)" filter="url(#glow)">
    <!-- Git container -->
    <rect x="-15" y="-20" width="100" height="180" rx="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Git branch visualization -->
    <g transform="translate(10, 10)">
      <use href="#gitBranch" width="60" height="80"/>
    </g>
    
    <!-- Commit messages hint -->
    <g transform="translate(5, 100)" opacity="0.4">
      <rect x="0" y="0" width="60" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="0" y="16" width="50" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="0" y="32" width="55" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
    </g>
    
    <text x="35" y="170" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.5">git push</text>
  </g>
  
  <!-- Arrow 3: Git splits to two deployment targets -->
  <g filter="url(#softGlow)">
    <!-- To Netlify (upper path) -->
    <path d="M920 270 Q1020 200 1120 220" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <polygon points="1120,220 1110,215 1112,225" fill="#ffffff" opacity="0.6"/>
    <circle r="3" fill="#ffffff">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M920,270 Q1020,200 1120,220"/>
    </circle>
    
    <!-- To GitHub Pages (lower path) -->
    <path d="M920 330 Q1020 400 1120 380" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <polygon points="1120,380 1110,375 1112,385" fill="#ffffff" opacity="0.6"/>
    <circle r="3" fill="#ffffff">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M920,330 Q1020,400 1120,380" begin="0.3s"/>
    </circle>
  </g>
  
  <!-- Stage 4a: Netlify (upper right) -->
  <g transform="translate(1130, 150)" filter="url(#glow)">
    <rect x="-15" y="-15" width="110" height="130" rx="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Netlify symbol -->
    <g transform="translate(15, 10)">
      <use href="#netlify" width="50" height="50"/>
    </g>
    
    <!-- Cloud/CDN -->
    <g transform="translate(0, 60)" opacity="0.6">
      <use href="#cloud" width="70" height="44"/>
    </g>
    
    <text x="40" y="120" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.5">Netlify</text>
  </g>
  
  <!-- Stage 4b: GitHub Pages (lower right) -->
  <g transform="translate(1130, 320)" filter="url(#glow)">
    <rect x="-15" y="-15" width="110" height="130" rx="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- GitHub Pages symbol -->
    <g transform="translate(15, 10)">
      <use href="#ghPages" width="50" height="50"/>
    </g>
    
    <!-- Deploy symbol -->
    <g transform="translate(20, 55)" opacity="0.6">
      <use href="#deploy" width="40" height="56"/>
    </g>
    
    <text x="40" y="120" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.5">GH Pages</text>
  </g>
  
  <!-- Arrow 4: Both deploy to globe -->
  <g filter="url(#softGlow)">
    <!-- From Netlify -->
    <path d="M1260 220 Q1340 260 1420 300" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <!-- From GitHub Pages -->
    <path d="M1260 380 Q1340 340 1420 300" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    
    <circle r="3" fill="#ffffff" opacity="0.8">
      <animateMotion dur="2s" repeatCount="indefinite" path="M1260,220 Q1340,260 1420,300"/>
    </circle>
    <circle r="3" fill="#ffffff" opacity="0.8">
      <animateMotion dur="2s" repeatCount="indefinite" path="M1260,380 Q1340,340 1420,300" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Stage 5: Live/Globe (far right) -->
  <g transform="translate(1450, 240)" filter="url(#strongGlow)">
    <!-- Outer rings -->
    <circle cx="60" cy="60" r="85" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="60" r="75" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>
    
    <!-- Globe -->
    <g transform="translate(30, 30)">
      <use href="#globe" width="60" height="60"/>
    </g>
    
    <!-- Pulse effect -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="50;65;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <text x="60" y="160" fill="#ffffff" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle" opacity="0.6">LIVE</text>
  </g>
  
  <!-- Floating decorative elements -->
  
  <!-- Clean White theme hint - top -->
  <g transform="translate(900, 50)" opacity="0.2">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="none" stroke="#ffffff" stroke-width="1"/>
    <text x="60" y="25" fill="#ffffff" font-family="Georgia, serif" font-size="12" text-anchor="middle">cleanwhite</text>
  </g>
  
  <!-- Floating markdown files - top left -->
  <g transform="translate(50, 80)" opacity="0.15">
    <use href="#markdown" width="30" height="35"/>
  </g>
  <g transform="translate(320, 50)" opacity="0.1">
    <use href="#markdown" width="25" height="29"/>
  </g>
  
  <!-- Floating code brackets - top right -->
  <g transform="translate(1750, 60)" opacity="0.15">
    <use href="#brackets" width="35" height="42"/>
  </g>
  
  <!-- Floating deploy symbols - bottom -->
  <g transform="translate(650, 480)" opacity="0.12">
    <use href="#deploy" width="30" height="42"/>
  </g>
  <g transform="translate(1300, 500)" opacity="0.1">
    <use href="#deploy" width="25" height="35"/>
  </g>
  
  <!-- Corner accents -->
  <g opacity="0.15">
    <!-- Top left -->
    <line x1="30" y1="30" x2="100" y2="30" stroke="#ffffff" stroke-width="1"/>
    <line x1="30" y1="30" x2="30" y2="100" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Top right -->
    <line x1="1820" y1="30" x2="1890" y2="30" stroke="#ffffff" stroke-width="1"/>
    <line x1="1890" y1="30" x2="1890" y2="100" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Bottom left -->
    <line x1="30" y1="570" x2="100" y2="570" stroke="#ffffff" stroke-width="1"/>
    <line x1="30" y1="500" x2="30" y2="570" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Bottom right -->
    <line x1="1820" y1="570" x2="1890" y2="570" stroke="#ffffff" stroke-width="1"/>
    <line x1="1890" y1="500" x2="1890" y2="570" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Pipeline label at bottom -->
  <g transform="translate(700, 540)" opacity="0.35">
    <text fill="#ffffff" font-family="'SF Mono', 'Monaco', monospace" font-size="11" letter-spacing="2">
      content → build → commit → deploy → live
    </text>
    <line x1="0" y1="18" x2="520" y2="18" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 3"/>
  </g>
  
  <!-- Apply noise texture -->
  <rect width="100%" height="100%" fill="transparent" filter="url(#noise)"/>
  
  <!-- Subtle scan lines -->
  <g opacity="0.02">
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="100%" height="3">
      <line x1="0" y1="0" x2="1920" y2="0" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#scanlines)"/>
  </g>
</svg>
