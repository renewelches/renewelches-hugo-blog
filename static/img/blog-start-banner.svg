<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Noise texture filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="blend" mode="overlay"/>
    </filter>
    
    <!-- Background gradient - deeper, more dramatic -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808"/>
      <stop offset="30%" style="stop-color:#0c0c0c"/>
      <stop offset="70%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#060606"/>
    </linearGradient>
    
    <!-- Radial spotlight -->
    <radialGradient id="spotlight" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.03"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Terminal/Command prompt symbol -->
    <symbol id="terminal" viewBox="0 0 80 60">
      <rect x="2" y="2" width="76" height="56" rx="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <line x1="2" y1="14" x2="78" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      <circle cx="10" cy="8" r="2.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="18" cy="8" r="2.5" fill="#ffffff" opacity="0.5"/>
      <circle cx="26" cy="8" r="2.5" fill="#ffffff" opacity="0.5"/>
      <!-- Prompt -->
      <text x="10" y="30" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" opacity="0.8">$_</text>
      <line x1="10" y1="40" x2="50" y2="40" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
      <line x1="10" y1="48" x2="40" y2="48" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    </symbol>
    
    <!-- Server/Infrastructure symbol -->
    <symbol id="server" viewBox="0 0 50 70">
      <rect x="5" y="5" width="40" height="60" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <rect x="10" y="12" width="30" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="10" y="24" width="30" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="10" y="36" width="30" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1"/>
      <circle cx="15" cy="52" r="3" fill="#ffffff" opacity="0.8"/>
      <circle cx="25" cy="52" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="35" cy="52" r="3" fill="#ffffff" opacity="0.3"/>
    </symbol>
    
    <!-- Code brackets -->
    <symbol id="brackets" viewBox="0 0 60 70">
      <path d="M22 5 L10 5 Q5 5 5 10 L5 60 Q5 65 10 65 L22 65" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M38 5 L50 5 Q55 5 55 10 L55 60 Q55 65 50 65 L38 65" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    
    <!-- Network node -->
    <symbol id="node" viewBox="0 0 30 30">
      <circle cx="15" cy="15" r="12" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="15" cy="15" r="5" fill="#ffffff"/>
    </symbol>
    
    <!-- Blog/Writing symbol -->
    <symbol id="pen" viewBox="0 0 50 60">
      <!-- Pen body -->
      <path d="M40 5 L45 10 L15 50 L8 52 L10 45 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Pen tip detail -->
      <line x1="12" y1="43" x2="17" y2="48" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Edit lines hint -->
      <line x1="20" y1="55" x2="45" y2="55" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    </symbol>
    
    <!-- Lightbulb/Ideas symbol -->
    <symbol id="lightbulb" viewBox="0 0 40 55">
      <!-- Bulb -->
      <path d="M20 5 C8 5 3 15 3 23 C3 32 10 36 12 42 L28 42 C30 36 37 32 37 23 C37 15 32 5 20 5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Base -->
      <line x1="12" y1="46" x2="28" y2="46" stroke="#ffffff" stroke-width="2"/>
      <line x1="14" y1="50" x2="26" y2="50" stroke="#ffffff" stroke-width="2"/>
      <!-- Filament -->
      <path d="M15 25 Q20 20 25 25 Q20 30 15 25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
      <!-- Rays -->
      <line x1="20" y1="-2" x2="20" y2="-8" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <line x1="35" y1="8" x2="40" y2="3" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      <line x1="5" y1="8" x2="0" y2="3" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    </symbol>
    
    <!-- Cloud symbol -->
    <symbol id="cloud" viewBox="0 0 60 40">
      <path d="M48 32 C56 32 58 26 54 20 C56 14 50 8 42 10 C38 4 28 4 24 10 C16 6 8 12 12 22 C4 24 6 32 14 34 L48 34 C52 34 54 32 48 32" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    </symbol>
    
    <!-- Gear symbol -->
    <symbol id="gear" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="7" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <path d="M20 4 L20 9 M20 31 L20 36 M4 20 L9 20 M31 20 L36 20 
               M8.5 8.5 L12 12 M28 28 L31.5 31.5 M31.5 8.5 L28 12 M12 28 L8.5 31.5" 
            stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    
    <!-- Constellation pattern -->
    <pattern id="constellation" patternUnits="userSpaceOnUse" width="300" height="300">
      <!-- Stars -->
      <circle cx="50" cy="50" r="1" fill="#ffffff" opacity="0.3"/>
      <circle cx="150" cy="80" r="1.2" fill="#ffffff" opacity="0.25"/>
      <circle cx="250" cy="40" r="0.8" fill="#ffffff" opacity="0.2"/>
      <circle cx="100" cy="180" r="1" fill="#ffffff" opacity="0.25"/>
      <circle cx="200" cy="150" r="1.5" fill="#ffffff" opacity="0.3"/>
      <circle cx="280" cy="200" r="1" fill="#ffffff" opacity="0.2"/>
      <circle cx="30" cy="250" r="1.2" fill="#ffffff" opacity="0.25"/>
      <circle cx="180" cy="280" r="0.8" fill="#ffffff" opacity="0.2"/>
      <!-- Connecting lines -->
      <line x1="50" y1="50" x2="150" y2="80" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>
      <line x1="150" y1="80" x2="200" y2="150" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>
      <line x1="100" y1="180" x2="200" y2="150" stroke="#ffffff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
    
    <!-- Subtle grid -->
    <pattern id="grid" patternUnits="userSpaceOnUse" width="50" height="50">
      <line x1="0" y1="50" x2="50" y2="50" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
      <line x1="50" y1="0" x2="50" y2="50" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Spotlight effect -->
  <rect width="100%" height="100%" fill="url(#spotlight)"/>
  
  <!-- Constellation pattern -->
  <rect width="100%" height="100%" fill="url(#constellation)"/>
  
  <!-- Subtle grid -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Central geometric composition -->
  
  <!-- Large central hexagon frame -->
  <g transform="translate(960, 300)" filter="url(#strongGlow)">
    <!-- Outer hexagon -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" 
             fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    
    <!-- Middle rotating hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" 
             fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="120s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Inner hexagon -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" 
             fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="90s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Center point with pulse -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="20;35;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Six orbiting tech icons around center -->
  
  <!-- Position 1: Terminal (top) -->
  <g transform="translate(960, 120)" filter="url(#glow)">
    <g transform="translate(-40, -30)">
      <use href="#terminal" width="80" height="60"/>
    </g>
    <!-- Connecting line to center -->
    <line x1="0" y1="35" x2="0" y2="130" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  </g>
  
  <!-- Position 2: Server (top-right) -->
  <g transform="translate(1150, 180)" filter="url(#glow)">
    <g transform="translate(-25, -35)">
      <use href="#server" width="50" height="70"/>
    </g>
    <line x1="-50" y1="20" x2="-120" y2="80" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  </g>
  
  <!-- Position 3: Code brackets (bottom-right) -->
  <g transform="translate(1150, 420)" filter="url(#glow)">
    <g transform="translate(-30, -35)">
      <use href="#brackets" width="60" height="70"/>
    </g>
    <line x1="-55" y1="-15" x2="-120" y2="-80" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  </g>
  
  <!-- Position 4: Cloud (bottom) -->
  <g transform="translate(960, 480)" filter="url(#glow)">
    <g transform="translate(-30, -20)">
      <use href="#cloud" width="60" height="40"/>
    </g>
    <line x1="0" y1="-25" x2="0" y2="-130" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  </g>
  
  <!-- Position 5: Pen/Blog (bottom-left) -->
  <g transform="translate(770, 420)" filter="url(#glow)">
    <g transform="translate(-25, -30)">
      <use href="#pen" width="50" height="60"/>
    </g>
    <line x1="55" y1="-15" x2="120" y2="-80" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  </g>
  
  <!-- Position 6: Gear (top-left) -->
  <g transform="translate(770, 180)" filter="url(#glow)">
    <g transform="translate(-20, -20)">
      <use href="#gear" width="40" height="40"/>
    </g>
    <line x1="50" y1="20" x2="120" y2="80" stroke="#ffffff" stroke-width="0.8" opacity="0.2"/>
  </g>
  
  <!-- Floating network nodes - left side -->
  <g filter="url(#softGlow)">
    <g transform="translate(150, 200)">
      <use href="#node" width="25" height="25"/>
    </g>
    <g transform="translate(250, 150)">
      <use href="#node" width="20" height="20"/>
    </g>
    <g transform="translate(200, 320)">
      <use href="#node" width="22" height="22"/>
    </g>
    <g transform="translate(100, 400)">
      <use href="#node" width="18" height="18"/>
    </g>
    <g transform="translate(320, 380)">
      <use href="#node" width="20" height="20"/>
    </g>
    
    <!-- Node connections -->
    <line x1="162" y1="212" x2="250" y2="160" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="162" y1="212" x2="211" y2="331" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="211" y1="331" x2="109" y2="409" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="211" y1="331" x2="330" y2="391" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="260" y1="160" x2="330" y2="391" stroke="#ffffff" stroke-width="0.8" opacity="0.1"/>
    
    <!-- Animated data packet -->
    <circle r="3" fill="#ffffff" opacity="0.6">
      <animateMotion dur="4s" repeatCount="indefinite" path="M162,212 L250,160 L330,391 L211,331 L109,409"/>
    </circle>
  </g>
  
  <!-- Floating network nodes - right side -->
  <g filter="url(#softGlow)">
    <g transform="translate(1700, 180)">
      <use href="#node" width="22" height="22"/>
    </g>
    <g transform="translate(1600, 280)">
      <use href="#node" width="25" height="25"/>
    </g>
    <g transform="translate(1750, 350)">
      <use href="#node" width="20" height="20"/>
    </g>
    <g transform="translate(1650, 450)">
      <use href="#node" width="18" height="18"/>
    </g>
    <g transform="translate(1800, 250)">
      <use href="#node" width="16" height="16"/>
    </g>
    
    <!-- Node connections -->
    <line x1="1711" y1="191" x2="1612" y2="292" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="1612" y1="292" x2="1761" y2="361" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="1612" y1="292" x2="1659" y2="459" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="1711" y1="191" x2="1808" y2="258" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
    <line x1="1808" y1="258" x2="1761" y2="361" stroke="#ffffff" stroke-width="0.8" opacity="0.1"/>
    
    <!-- Animated data packet -->
    <circle r="3" fill="#ffffff" opacity="0.6">
      <animateMotion dur="5s" repeatCount="indefinite" path="M1711,191 L1808,258 L1761,361 L1612,292 L1659,459" begin="1s"/>
    </circle>
  </g>
  
  <!-- Floating idea lightbulbs -->
  <g transform="translate(400, 100)" opacity="0.25" filter="url(#glow)">
    <use href="#lightbulb" width="30" height="42"/>
  </g>
  <g transform="translate(1500, 80)" opacity="0.2" filter="url(#glow)">
    <use href="#lightbulb" width="25" height="35"/>
  </g>
  
  <!-- Decorative code snippets floating -->
  <g transform="translate(80, 150)" opacity="0.12">
    <text fill="#ffffff" font-family="'SF Mono', monospace" font-size="11">func main()</text>
  </g>
  <g transform="translate(1720, 500)" opacity="0.1">
    <text fill="#ffffff" font-family="'SF Mono', monospace" font-size="10">return nil</text>
  </g>
  <g transform="translate(100, 500)" opacity="0.1">
    <text fill="#ffffff" font-family="'SF Mono', monospace" font-size="10">import os</text>
  </g>
  <g transform="translate(1750, 150)" opacity="0.12">
    <text fill="#ffffff" font-family="'SF Mono', monospace" font-size="11">deploy:</text>
  </g>
  
  <!-- Geometric accent shapes -->
  <g opacity="0.1">
    <!-- Top left triangle -->
    <polygon points="50,50 120,50 50,120" fill="none" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Top right triangle -->
    <polygon points="1870,50 1800,50 1870,120" fill="none" stroke="#ffffff" stroke-width="1"/>
    
    <!-- Bottom decorative lines -->
    <line x1="50" y1="550" x2="250" y2="550" stroke="#ffffff" stroke-width="1"/>
    <circle cx="260" cy="550" r="4" fill="none" stroke="#ffffff" stroke-width="1"/>
    
    <line x1="1670" y1="550" x2="1870" y2="550" stroke="#ffffff" stroke-width="1"/>
    <circle cx="1660" cy="550" r="4" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Horizontal accent lines -->
  <g opacity="0.08">
    <line x1="0" y1="200" x2="600" y2="200" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="1320" y1="200" x2="1920" y2="200" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="1320" y1="400" x2="1920" y2="400" stroke="#ffffff" stroke-width="0.5"/>
  </g>
  
  <!-- Corner frame accents -->
  <g opacity="0.15">
    <!-- Top left -->
    <path d="M20 20 L20 70 M20 20 L70 20" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Top right -->
    <path d="M1900 20 L1900 70 M1900 20 L1850 20" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Bottom left -->
    <path d="M20 580 L20 530 M20 580 L70 580" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Bottom right -->
    <path d="M1900 580 L1900 530 M1900 580 L1850 580" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Orbiting dots around central composition -->
  <g filter="url(#softGlow)">
    <!-- Fast orbit -->
    <circle cx="960" cy="300" r="0" fill="#ffffff">
      <animate attributeName="r" values="3;3;3" dur="1s"/>
      <animateMotion dur="8s" repeatCount="indefinite" path="M0,-180 A180,180 0 1,1 0,180 A180,180 0 1,1 0,-180"/>
    </circle>
    
    <!-- Medium orbit -->
    <circle cx="960" cy="300" r="0" fill="#ffffff" opacity="0.6">
      <animate attributeName="r" values="2.5;2.5;2.5" dur="1s"/>
      <animateMotion dur="12s" repeatCount="indefinite" path="M0,-200 A200,200 0 1,1 0,200 A200,200 0 1,1 0,-200" begin="2s"/>
    </circle>
    
    <!-- Slow orbit -->
    <circle cx="960" cy="300" r="0" fill="#ffffff" opacity="0.4">
      <animate attributeName="r" values="2;2;2" dur="1s"/>
      <animateMotion dur="15s" repeatCount="indefinite" path="M0,-220 A220,220 0 1,0 0,220 A220,220 0 1,0 0,-220" begin="4s"/>
    </circle>
  </g>
  
  <!-- Subtle binary/data streams on edges -->
  <g opacity="0.06" font-family="'SF Mono', monospace" font-size="10" fill="#ffffff">
    <text x="30" y="250">01101000</text>
    <text x="30" y="270">01100101</text>
    <text x="30" y="290">01101100</text>
    <text x="30" y="310">01101100</text>
    <text x="30" y="330">01101111</text>
    
    <text x="1830" y="250">01110111</text>
    <text x="1830" y="270">01101111</text>
    <text x="1830" y="290">01110010</text>
    <text x="1830" y="310">01101100</text>
    <text x="1830" y="330">01100100</text>
  </g>
  
  <!-- Apply noise texture -->
  <rect width="100%" height="100%" fill="transparent" filter="url(#noise)"/>
  
  <!-- Very subtle vignette -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" opacity="0.3" style="mix-blend-mode: multiply"/>
  
  <!-- Subtle scan lines -->
  <g opacity="0.015">
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="100%" height="3">
      <line x1="0" y1="0" x2="1920" y2="0" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#scanlines)"/>
  </g>
</svg>
