<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Noise texture filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" result="blend"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="blend" mode="overlay"/>
    </filter>
    
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080808"/>
      <stop offset="40%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft glow for ambient elements -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Server/Node symbol -->
    <symbol id="server" viewBox="0 0 80 100">
      <!-- Server chassis -->
      <rect x="5" y="5" width="70" height="90" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Drive bays -->
      <rect x="12" y="15" width="56" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="12" y="32" width="56" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="12" y="49" width="56" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <!-- Status LEDs -->
      <circle cx="20" cy="75" r="3" fill="#ffffff"/>
      <circle cx="32" cy="75" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="44" cy="75" r="3" fill="#ffffff" opacity="0.3"/>
      <!-- Ventilation -->
      <line x1="52" y1="70" x2="62" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <line x1="52" y1="75" x2="62" y2="75" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
      <line x1="52" y1="80" x2="62" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    </symbol>
    
    <!-- Mini PC symbol -->
    <symbol id="minipc" viewBox="0 0 70 50">
      <rect x="3" y="3" width="64" height="44" rx="5" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Front panel -->
      <circle cx="15" cy="25" r="4" fill="#ffffff"/>
      <rect x="25" y="20" width="35" height="3" rx="1" fill="#ffffff" opacity="0.6"/>
      <rect x="25" y="27" width="25" height="3" rx="1" fill="#ffffff" opacity="0.4"/>
      <!-- Ventilation slots -->
      <line x1="8" y1="38" x2="18" y2="38" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <line x1="8" y1="42" x2="18" y2="42" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    </symbol>
    
    <!-- Container/VM symbol -->
    <symbol id="container" viewBox="0 0 50 50">
      <rect x="3" y="3" width="44" height="44" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Layered boxes inside -->
      <rect x="8" y="8" width="16" height="16" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="26" y="8" width="16" height="16" rx="2" fill="#ffffff" opacity="0.5"/>
      <rect x="8" y="26" width="16" height="16" rx="2" fill="#ffffff" opacity="0.5"/>
      <rect x="26" y="26" width="16" height="16" rx="2" fill="#ffffff" opacity="0.3"/>
    </symbol>
    
    <!-- Cube/VM 3D symbol -->
    <symbol id="cube" viewBox="0 0 60 70">
      <!-- 3D cube -->
      <polygon points="30,5 55,20 55,50 30,65 5,50 5,20" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="30" y1="5" x2="30" y2="35" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="5" y1="20" x2="30" y2="35" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="55" y1="20" x2="30" y2="35" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Inner detail -->
      <polygon points="30,35 30,65 5,50 5,20" fill="#ffffff" opacity="0.1"/>
    </symbol>
    
    <!-- Cluster connection symbol -->
    <symbol id="cluster" viewBox="0 0 100 100">
      <!-- Three interconnected nodes -->
      <circle cx="50" cy="20" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="20" cy="70" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="80" cy="70" r="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Connection lines -->
      <line x1="50" y1="32" x2="25" y2="60" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="50" y1="32" x2="75" y2="60" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="32" y1="70" x2="68" y2="70" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Center dots -->
      <circle cx="50" cy="20" r="4" fill="#ffffff"/>
      <circle cx="20" cy="70" r="4" fill="#ffffff"/>
      <circle cx="80" cy="70" r="4" fill="#ffffff"/>
    </symbol>
    
    <!-- Storage/disk symbol -->
    <symbol id="storage" viewBox="0 0 60 60">
      <ellipse cx="30" cy="15" rx="25" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="5" y1="15" x2="5" y2="45" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="55" y1="15" x2="55" y2="45" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="30" cy="45" rx="25" ry="10" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Middle layer -->
      <ellipse cx="30" cy="30" rx="25" ry="10" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    </symbol>
    
    <!-- Isometric grid pattern -->
    <pattern id="isoGrid" patternUnits="userSpaceOnUse" width="60" height="35" patternTransform="rotate(0)">
      <line x1="0" y1="17.5" x2="30" y2="0" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
      <line x1="30" y1="0" x2="60" y2="17.5" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
      <line x1="0" y1="17.5" x2="30" y2="35" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
      <line x1="30" y1="35" x2="60" y2="17.5" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    
    <!-- Circuit pattern -->
    <pattern id="circuit" patternUnits="userSpaceOnUse" width="100" height="100">
      <line x1="0" y1="50" x2="40" y2="50" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
      <line x1="50" y1="0" x2="50" y2="40" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
      <circle cx="50" cy="50" r="3" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
      <line x1="60" y1="50" x2="100" y2="50" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
      <line x1="50" y1="60" x2="50" y2="100" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Isometric grid overlay -->
  <rect width="100%" height="100%" fill="url(#isoGrid)" opacity="0.6"/>
  
  <!-- Circuit pattern layer -->
  <rect width="100%" height="100%" fill="url(#circuit)" opacity="0.4"/>
  
  <!-- Horizontal infrastructure lines -->
  <g opacity="0.12">
    <line x1="0" y1="200" x2="1920" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="1920" y2="400" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Left cluster: Node 1 (gmktec) -->
  <g transform="translate(180, 180)" filter="url(#glow)">
    <!-- Server outline glow -->
    <rect x="-15" y="-15" width="110" height="130" rx="8" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Mini PC -->
    <g transform="translate(0, 20)">
      <use href="#minipc" width="70" height="50"/>
    </g>
    
    <!-- VM/Container stack floating above -->
    <g transform="translate(5, -50)" opacity="0.7">
      <use href="#cube" width="35" height="40"/>
    </g>
    <g transform="translate(40, -40)" opacity="0.5">
      <use href="#cube" width="30" height="35"/>
    </g>
    
    <!-- Connection dots -->
    <circle cx="35" cy="90" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Node label hint -->
    <text x="35" y="115" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.4">node-1</text>
  </g>
  
  <!-- Center: Cluster visualization -->
  <g transform="translate(860, 200)" filter="url(#strongGlow)">
    <!-- Large cluster symbol -->
    <g transform="translate(-50, -50)">
      <use href="#cluster" width="100" height="100"/>
    </g>
    
    <!-- Rotating ring around cluster -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Quorum indicator -->
    <g transform="translate(-15, 70)">
      <text fill="#ffffff" font-family="'SF Mono', monospace" font-size="11" opacity="0.5">quorum: 3/3</text>
    </g>
  </g>
  
  <!-- Right cluster: Node 2 (minis) -->
  <g transform="translate(1450, 180)" filter="url(#glow)">
    <!-- Server outline glow -->
    <rect x="-15" y="-15" width="110" height="130" rx="8" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Mini PC -->
    <g transform="translate(5, 20)">
      <use href="#minipc" width="70" height="50"/>
    </g>
    
    <!-- VM/Container stack -->
    <g transform="translate(10, -45)" opacity="0.6">
      <use href="#cube" width="32" height="38"/>
    </g>
    <g transform="translate(42, -35)" opacity="0.4">
      <use href="#cube" width="28" height="32"/>
    </g>
    
    <!-- Connection dots -->
    <circle cx="40" cy="90" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <text x="40" y="115" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.4">node-2</text>
  </g>
  
  <!-- Node 3 (minix) - bottom center -->
  <g transform="translate(860, 420)" filter="url(#glow)">
    <rect x="-40" y="-15" width="80" height="90" rx="6" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <g transform="translate(-30, 0)">
      <use href="#minipc" width="60" height="42"/>
    </g>
    
    <g transform="translate(-15, -40)" opacity="0.5">
      <use href="#cube" width="30" height="35"/>
    </g>
    
    <circle cx="0" cy="55" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <text x="0" y="78" fill="#ffffff" font-family="'SF Mono', monospace" font-size="10" text-anchor="middle" opacity="0.4">node-3</text>
  </g>
  
  <!-- Cluster connection lines -->
  <g filter="url(#softGlow)">
    <!-- Node 1 to center -->
    <line x1="280" y1="260" x2="760" y2="230" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="280" y1="265" x2="760" y2="235" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Node 2 to center -->
    <line x1="1440" y1="260" x2="960" y2="230" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="1440" y1="265" x2="960" y2="235" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Node 3 to center -->
    <line x1="860" y1="380" x2="860" y2="300" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="865" y1="380" x2="865" y2="300" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Data packets moving on lines -->
    <circle r="3" fill="#ffffff">
      <animateMotion dur="3s" repeatCount="indefinite" path="M280,260 L760,230"/>
    </circle>
    <circle r="3" fill="#ffffff">
      <animateMotion dur="3.5s" repeatCount="indefinite" path="M1440,260 L960,230"/>
    </circle>
    <circle r="2" fill="#ffffff" opacity="0.7">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M860,380 L860,300"/>
    </circle>
  </g>
  
  <!-- Storage visualization - left bottom -->
  <g transform="translate(350, 400)" opacity="0.6" filter="url(#glow)">
    <use href="#storage" width="50" height="50"/>
    <text x="25" y="65" fill="#ffffff" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle" opacity="0.5">LVM</text>
  </g>
  
  <!-- Storage visualization - right bottom -->
  <g transform="translate(1500, 400)" opacity="0.6" filter="url(#glow)">
    <use href="#storage" width="50" height="50"/>
    <text x="25" y="65" fill="#ffffff" font-family="'SF Mono', monospace" font-size="9" text-anchor="middle" opacity="0.5">NVMe</text>
  </g>
  
  <!-- Floating container grid - left side -->
  <g transform="translate(50, 350)" opacity="0.3">
    <use href="#container" width="35" height="35"/>
  </g>
  <g transform="translate(95, 380)" opacity="0.2">
    <use href="#container" width="30" height="30"/>
  </g>
  
  <!-- Floating container grid - right side -->
  <g transform="translate(1820, 320)" opacity="0.3">
    <use href="#container" width="35" height="35"/>
  </g>
  <g transform="translate(1780, 360)" opacity="0.2">
    <use href="#container" width="30" height="30"/>
  </g>
  
  <!-- Floating VMs top -->
  <g transform="translate(600, 80)" opacity="0.25">
    <use href="#cube" width="40" height="48"/>
  </g>
  <g transform="translate(1250, 90)" opacity="0.2">
    <use href="#cube" width="35" height="42"/>
  </g>
  
  <!-- Decorative geometric elements -->
  <g opacity="0.15">
    <!-- Top left corner accent -->
    <polygon points="40,30 80,10 80,50" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="90" y1="30" x2="150" y2="30" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Top right corner accent -->
    <polygon points="1880,30 1840,10 1840,50" fill="none" stroke="#ffffff" stroke-width="1"/>
    <line x1="1830" y1="30" x2="1770" y2="30" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Bottom decorative lines -->
    <line x1="50" y1="550" x2="200" y2="550" stroke="#ffffff" stroke-width="1"/>
    <circle cx="210" cy="550" r="4" fill="none" stroke="#ffffff" stroke-width="1"/>
    
    <line x1="1720" y1="550" x2="1870" y2="550" stroke="#ffffff" stroke-width="1"/>
    <circle cx="1710" cy="550" r="4" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Terminal/CLI aesthetic element -->
  <g transform="translate(700, 520)" opacity="0.35">
    <text fill="#ffffff" font-family="'SF Mono', 'Monaco', monospace" font-size="11" letter-spacing="1">
      pvecm status │ Nodes: 3 │ Quorate: Yes
    </text>
    <line x1="0" y1="15" x2="380" y2="15" stroke="#ffffff" stroke-width="0.5" stroke-dasharray="2 3"/>
  </g>
  
  <!-- Subtle rack unit markers on sides -->
  <g opacity="0.08">
    <line x1="20" y1="100" x2="20" y2="500" stroke="#ffffff" stroke-width="2"/>
    <line x1="15" y1="150" x2="25" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="200" x2="25" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="250" x2="25" y2="250" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="300" x2="25" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="350" x2="25" y2="350" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="400" x2="25" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="15" y1="450" x2="25" y2="450" stroke="#ffffff" stroke-width="1"/>
    
    <line x1="1900" y1="100" x2="1900" y2="500" stroke="#ffffff" stroke-width="2"/>
    <line x1="1895" y1="150" x2="1905" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="1895" y1="200" x2="1905" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="1895" y1="250" x2="1905" y2="250" stroke="#ffffff" stroke-width="1"/>
    <line x1="1895" y1="300" x2="1905" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="1895" y1="350" x2="1905" y2="350" stroke="#ffffff" stroke-width="1"/>
    <line x1="1895" y1="400" x2="1905" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="1895" y1="450" x2="1905" y2="450" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Apply noise texture overlay -->
  <rect width="100%" height="100%" fill="transparent" filter="url(#noise)"/>
  
  <!-- Scan line effect -->
  <g opacity="0.025">
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="100%" height="3">
      <line x1="0" y1="0" x2="1920" y2="0" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#scanlines)"/>
  </g>
</svg>
